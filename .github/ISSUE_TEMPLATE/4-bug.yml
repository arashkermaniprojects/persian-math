name: Bug · خطا
description: Something doesn't work, looks broken, or fails offline or on your phone.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page · صفحه
    validations: { required: true }
  - type: input
    id: device
    attributes:
      label: Phone/computer and browser · گوشی/رایانه و مرورگر
      description: e.g. "Samsung A10, Chrome", or "laptop, Firefox, offline zip".
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect? · چه اتفاقی افتاد و انتظار چه داشتید؟
    validations: { required: true }
