# Kamangir Phase 2 plan: primary studios (ages 5-11).
# Generated by a planning script; ages and grades are computed from content/concepts align keys
# (lowest grade per curriculum; UK KS3 counts as 7). Phase 1 frac studios hold orders 1-8, so new frac studios start at 9.
# Studios with extra: true are «Extra» studios of specialist concepts.
studios:
- id: num-count-to-10
  strand: num
  engine: counters
  order: 1
  concepts: [num.count.pre-number, num.count.to-10, num.compare]
  title_fa: شمارش و مقایسهٔ عددها تا ۱۰
  title_en: Counting and comparing to 10
  ages: [5, 9]
  grades: {iran: 1, af: 1, uk: 1}
  notes: Match one-to-one, sort and compare groups of counters, count into a ten-frame, then write <, > and =. Iran/Afghan G1 drill digit forms ۰–۹ (Afghan book opens with «دورهٔ آماده‌گی»); UK Y1 goes
    straight on to 20.
- id: num-numbers-to-20
  strand: num
  engine: counters
  order: 2
  concepts: [num.count.to-20, num.more-less, num.ordinal]
  title_fa: 'عددهای ۱۰ تا ۲۰: یک ده و چند یکی'
  title_en: 'Numbers to 20: a ten and some ones'
  ages: [5, 9]
  grades: {iran: 1, af: 1, uk: 1}
  notes: Two ten-frames show teen numbers as one full ten plus ones; one more/one less, before/after/between; ordinals with a queue of counters (Afghan G2 «اعداد ترتیبی»). Keep within 20; 'ten/hundred more'
    is done later on the place-value engine.
- id: num-number-line-skip
  strand: num
  engine: number-line
  order: 3
  concepts: [num.number-line, num.count.skip, num.even-odd]
  title_fa: محور اعداد و شمارش چندتا چندتا
  title_en: Number line, skip counting, odd and even
  ages: [5, 10]
  grades: {iran: 1, af: 2, uk: 1}
  notes: 'Place and estimate numbers on 0–20 then 0–100 lines, hop in 2s, 5s and 10s, and find that even numbers are the 2-hop landings. Wording: Iran «زوج و فرد», Afghan «جفت و تاق», UK odd/even.'
- id: num-place-value-100
  strand: num
  engine: place-value
  order: 4
  concepts: [num.place-value.to-100, num.count.to-100, ops.add-sub.tens, ops.add-sub.regroup]
  title_fa: 'دسته‌های ده‌تایی و یکی: عددهای دورقمی'
  title_en: 'Tens and ones: numbers to 100'
  ages: [5, 8]
  grades: {iran: 1, af: 1, uk: 1}
  notes: Bundle ten ones into a ten-rod, read/write to 100, add and take whole tens, then exchange a ten for ones (and back) before any column method. fa-AF/ps default to the «چوت» abacus view and the term
    «قیمت مقامی»; Iran uses «دسته‌های ده‌تایی» and the place-value table.
- id: num-place-value-10000
  strand: num
  engine: place-value
  order: 5
  concepts: [num.place-value.to-1000, num.place-value.to-10000, num.place-value.expanded, num.roman]
  title_fa: عددهای سه‌رقمی و چهاررقمی و نمایش گسترده
  title_en: 'Hundreds and thousands: place value and expanded form'
  ages: [8, 12]
  grades: {iran: 2, af: 2, uk: 3}
  notes: 'Build 3- and 4-digit numbers with blocks/abacus, read the place-value table (یکان، دهگان، صدگان، هزارگان), write expanded form, compare by highest place. Last mission: Roman numerals (UK Y3–4,
    AF G6) as I/X/C/M column symbols; hidden for fa-IR by default.'
- id: num-large-rounding
  strand: num
  engine: place-value
  order: 6
  concepts: [num.place-value.large, num.rounding, ops.estimate]
  title_fa: عددهای بزرگ، تقریب و تخمین
  title_en: Large numbers, rounding and estimating
  ages: [8, 12]
  grades: {iran: 2, af: 3, uk: 3}
  notes: Read and write millions/billions in three-digit classes (separator ٬ in fa, , in en), round to the nearest 10/100/1000 by looking at the next column, then estimate a sum before computing it. Iran
    calls rounding «تقریب»; UK Y4–6 rounding to 1 000 000.
- id: num-negative
  strand: num
  engine: number-line
  order: 7
  concepts: [num.negative, num.integers.add-sub]
  title_fa: عددهای صحیح (علامت‌دار)
  title_en: Negative numbers and integers
  ages: [9, 12]
  grades: {iran: 6, af: 7, uk: 4}
  notes: Extend the line left of zero (temperature and sea-level contexts, UK Y4), then add and subtract integers as moves. The line still increases left to right in RTL locales; Iran G6 introduces «عددهای
    علامت‌دار», operations are G7.
- id: num-rounding-decimals
  strand: num
  engine: number-line
  order: 8
  concepts: [frac.decimal.round, num.rounding.decimals-sigfig, num.bounds]
  title_fa: تقریب عددهای اعشاری
  title_en: Rounding decimals
  ages: [9, 12]
  grades: {iran: 6, af: null, uk: 4}
  notes: 'Zoom between the two neighbours and decide which is nearer: to 1 then 2 decimal places, then significant figures, then the lower/upper bound interval (Iran G6 «تقریب» chapter). Decimal mark: /
    for fa-IR, , for fa-AF/ps, . for en.'
- id: num-factors-primes
  strand: num
  engine: counters
  order: 9
  concepts: [num.factors-multiples, num.primes, num.prime-factorisation]
  title_fa: شمارنده‌ها، مضرب‌ها و عددهای اول
  title_en: Factors, multiples and primes
  ages: [9, 12]
  grades: {iran: 7, af: 5, uk: 4}
  notes: 'Arrange n counters into every possible rectangle to list factor pairs; a prime makes only one rectangle; split groups repeatedly for a prime factorisation. Terms: Iran «شمارنده», Afghan «عامل/قاسم»,
    UK factor.'
- id: num-divisibility-powers
  strand: num
  engine: pattern-machine
  order: 10
  concepts: [num.divisibility, num.hcf-lcm, num.squares-cubes, num.powers]
  title_fa: بخش‌پذیری، ب.م.م، ک.م.م و توان
  title_en: Divisibility, HCF, LCM and powers
  ages: [10, 12]
  grades: {iran: 4, af: 5, uk: 5}
  notes: Shade multiples on a hundred square to discover divisibility rules (2, 3, 5, 9, 10) and common multiples/factors (ب.م.م/ک.م.م in Iran, «بزرگترین قاسم مشترک» in Afghanistan, HCF/LCM in the UK);
    then growing square/cube patterns and an n → nᵏ machine.
- id: ops-add-sub-10
  strand: ops
  engine: counters
  order: 1
  concepts: [ops.add.concept, ops.sub.concept, ops.add-sub.within-10]
  title_fa: جمع و تفریق تا ۱۰
  title_en: Adding and taking away within 10
  ages: [5, 7]
  grades: {iran: 1, af: 1, uk: 1}
  notes: Join two groups and write +/=, take counters away and compare two rows for difference, then part-whole number bonds of 10. Same in all three books; UK says 'number bonds', Iran «حقایق عددی».
- id: ops-add-sub-20
  strand: ops
  engine: counters
  order: 2
  concepts: [ops.add-sub.within-20, ops.add.three-addends, ops.add.properties, ops.add-sub.inverse]
  title_fa: جمع و تفریق تا ۲۰ و عبور از ده
  title_en: 'Within 20: bridging ten and fact families'
  ages: [5, 12]
  grades: {iran: 1, af: 2, uk: 1}
  notes: Make ten on a double ten-frame to bridge, add three numbers by finding a ten first, swap addends (Afghan «خاصیت تبدیلی»), and build the four facts of a part-whole family.
- id: ops-number-line-jumps
  strand: ops
  engine: number-line
  order: 3
  concepts: [ops.add-sub.number-line, ops.add-sub.mental]
  title_fa: جمع و تفریق ذهنی روی محور
  title_en: Mental adding and subtracting with jumps
  ages: [7, 11]
  grades: {iran: 1, af: 1, uk: 2}
  notes: Show a calculation as jumps (tens then ones, or to the next ten); Iran G1–2 use a marked محور, the UK uses an empty number line. Two-digit and then three-digit numbers.
- id: ops-mul-div-groups
  strand: ops
  engine: counters
  order: 4
  concepts: [ops.mul.concept, ops.div.concept, ops.mul-div.inverse, ops.mul.properties]
  title_fa: ضرب و تقسیم با دسته‌های مساوی
  title_en: 'Equal groups: multiplying and dividing'
  ages: [5, 12]
  grades: {iran: 3, af: 2, uk: 1}
  notes: Repeated addition into equal groups and arrays (Afghan «ساختن قطارها»), sharing vs grouping for division, turn an array for commutativity and split it for the distributive law, link ×/÷ as one
    fact family.
- id: ops-times-tables
  strand: ops
  engine: fact-fluency
  order: 5
  concepts: [ops.mul-div.facts.2-5-10, ops.mul-div.facts, ops.mul-div.zero-one, ops.mul-div.mental]
  title_fa: جدول ضرب
  title_en: Times tables
  ages: [7, 11]
  grades: {iran: 3, af: 2, uk: 2}
  notes: Start with 2, 5, 10, then ×0 and ×1 rules, then the rest with derived facts (double, near ten). UK goes to 12×12 (Y4 multiplication check); Iran/Afghan to 10×10. Spaced repetition; timer off by
    default.
- id: ops-times-10-100
  strand: ops
  engine: place-value
  order: 6
  concepts: [ops.mul.by-10-100, frac.decimal.mul-div-10]
  title_fa: ضرب و تقسیم در ۱۰، ۱۰۰ و ۱۰۰۰
  title_en: Multiplying and dividing by 10, 100 and 1000
  ages: [9, 12]
  grades: {iran: 3, af: 3, uk: 4}
  notes: Digits slide across the place-value chart (never 'add a zero'), first for whole numbers, then for decimals past the decimal mark.
- id: ops-column-add-sub
  strand: ops
  engine: column-arithmetic
  order: 7
  concepts: [ops.add-sub.written, ops.add-sub.written-large, ops.check.add-sub, frac.decimal.add-sub]
  title_fa: جمع و تفریق ستونی
  title_en: Column addition and subtraction
  ages: [7, 12]
  grades: {iran: 2, af: 2, uk: 2}
  notes: Digit-by-digit with carry and borrow. Iran writes it in a place-value table header («جمع در جدول ارزش مکانی»); Afghan says «حاصل» and «قرض گرفتن» and checks by the inverse («امتحان»); UK column
    method with carried digit under the line. Last mission lines up decimal marks.
- id: ops-column-mul
  strand: ops
  engine: column-arithmetic
  order: 8
  concepts: [ops.mul.short, ops.mul.written, frac.decimal.mul]
  title_fa: ضرب ستونی
  title_en: Column multiplication
  ages: [8, 12]
  grades: {iran: 3, af: 2, uk: 3}
  notes: Short multiplication by one digit, then long multiplication with partial products (UK writes the placeholder 0; Iran/Afghan «ضرب به شکل عمودی» may shift the row instead), then decimals by counting
    decimal places.
- id: ops-division
  strand: ops
  engine: long-division
  order: 9
  concepts: [ops.div.remainder, ops.div.short, ops.div.written, ops.check.mul-div]
  title_fa: تقسیم با باقی‌مانده و تقسیم طولانی
  title_en: Division with remainders and long division
  ages: [9, 12]
  grades: {iran: 3, af: 3, uk: 5}
  notes: 'Remainders and what to do with them in context, short division, then by a two-digit divisor; check with quotient × divisor + remainder (Afghan «امتحان تقسیم»). Layout auto: gallows for fa-IR/fa-AF/ps,
    bus stop for en.'
- id: ops-extra-abacus
  strand: ops
  engine: place-value
  order: 10
  concepts: [ops.add-sub.abacus, ops.add-sub.regroup]
  title_fa: 'تکمیلی: جمع و تفریق با چوت'
  title_en: 'Extra: adding and subtracting on the abacus'
  ages: [8, 8]
  grades: {iran: 2, af: 2, uk: null}
  notes: 'Extra studio for the specialist abacus concept (Afghan G2 lessons 24–25, «جمع/تفریق اعداد با چوت»): add and subtract two-digit numbers by moving beads, exchanging ten beads for one on the next
    rod. Featured for fa-AF/ps, optional elsewhere.'
  extra: true
- id: frac-of-a-set
  strand: frac
  engine: counters
  order: 9
  concepts: [frac.of-amount, ratio.scaling]
  title_fa: کسری از یک مقدار
  title_en: A fraction of an amount
  ages: [7, 10]
  grades: {iran: 3, af: null, uk: 2}
  notes: Share counters into equal groups and take some groups (⅓ of 12, ¾ of 20), then scale a quantity up and down by whole numbers and simple fractions (UK Y3 recipes). Iran G3 «کسری از یک مقدار».
- id: frac-fdp-percent
  strand: frac
  engine: fraction-bars
  order: 10
  concepts: [frac.decimal.to-fraction, frac.percent, frac.fdp, frac.percent.of-amount, frac.percent.one-of-another]
  title_fa: درصد و تبدیل کسر، اعشار و درصد
  title_en: Percentages and fraction–decimal–percent conversion
  ages: [9, 12]
  grades: {iran: 5, af: 6, uk: 4}
  notes: 'A 10×10 area model (rows option) shows hundredths = percent; convert among the three forms; a 100% bar for ''percent of'' and ''what percent''. Terms: Iran «درصد», Afghan «فیصد».'
- id: frac-mixed-mul-div
  strand: frac
  engine: fraction-bars
  order: 11
  concepts: [frac.mul.mixed, frac.mul-div, frac.mixed-operations]
  title_fa: ضرب و تقسیم عددهای مخلوط
  title_en: Multiplying and dividing mixed numbers
  ages: [10, 12]
  grades: {iran: 5, af: 5, uk: 5}
  notes: Area model for mixed × mixed, then fluent ×/÷ of fractions and mixed numbers, then a multi-step calculation that respects operation priority. Negative fractions (Afghan G7) only in an optional
    last mission.
- id: frac-decimal-division
  strand: frac
  engine: long-division
  order: 12
  concepts: [frac.decimal.div, frac.decimal.recurring, num.recurring-decimals, frac.decimal.recurring-to-fraction]
  title_fa: تقسیم اعشاری و عددهای اعشاری متناوب
  title_en: Decimal division and recurring decimals
  ages: [12, 12]
  grades: {iran: 6, af: 6, uk: 10}
  notes: Scale both numbers so the divisor is whole (Iran G6), carry the division on until the remainder repeats to see recurring digits; recurring-to-fraction (Afghan G6) as a ×10 extension mission.
- id: fin-money-coins
  strand: fin
  engine: clock-calendar-money
  order: 1
  concepts: [meas.money.coins, fin.money.combine]
  title_fa: 'آشنایی با پول: سکه و اسکناس'
  title_en: Coins and notes
  ages: [5, 9]
  grades: {iran: 2, af: null, uk: 1}
  notes: 'Recognise the local coins/notes and make one amount in several ways. Iran: notes say ریال but prices are in تومان (×10), Iran G2 «معرّفی پول»; afghani for fa-AF/ps; pounds and pence for en (UK
    Y1–2).'
- id: fin-shopping-change
  strand: fin
  engine: clock-calendar-money
  order: 2
  concepts: [meas.money.calculate, fin.money.change, fin.money.decimal]
  title_fa: خرید کردن و باقی‌ماندهٔ پول
  title_en: Shopping and change
  ages: [7, 12]
  grades: {iran: 3, af: null, uk: 2}
  notes: Total a basket, pay, count up to give change. Decimal money (£3.45) is UK-only; Iranian and Afghan prices stay whole numbers, so the decimal mission is en-only.
- id: fin-percent-money
  strand: fin
  engine: fraction-bars
  order: 3
  concepts: [fin.percent, fin.discount, fin.profit-loss, ratio.percent-change]
  title_fa: 'درصد در خرید و فروش: تخفیف، سود و زیان'
  title_en: 'Percent in money: discounts, profit and loss'
  ages: [11, 12]
  grades: {iran: 6, af: 8, uk: 7}
  notes: 100% bar model for discount, sale price, percentage increase/decrease and profit/loss (Iran G6 «سود و زیان»; Afghan G8 «فیصد»). Not in UK KS2, so en is optional enrichment.
- id: geo-flat-shapes
  strand: geo
  engine: shape-board
  order: 1
  concepts: [geo.shapes.2d.recognise, geo.shapes.2d.properties, geo.symmetry.line]
  title_fa: شکل‌های هندسی و تقارن
  title_en: Flat shapes and symmetry
  ages: [5, 12]
  grades: {iran: 1, af: 1, uk: 1}
  notes: Name and draw circle, triangle, square and rectangle on the geoboard, count sides and vertices, sort shapes, then find fold lines of symmetry (Iran G2 «تقارن»).
- id: geo-solids
  strand: geo
  engine: shape-board
  order: 2
  concepts: [geo.shapes.3d.recognise, geo.solids.2d-representations, geo.solids.properties]
  title_fa: 'شکل‌های فضایی: مکعب، استوانه، کره…'
  title_en: Solid shapes
  ages: [5, 12]
  grades: {iran: 7, af: 6, uk: 1}
  notes: Recognise cube, cuboid, cylinder, cone, sphere and pyramid from pictures, count faces/edges/vertices. Strongest in UK Y1–3; Iran treats solids in G7. Needs the shape-board's 3D-picture (isometric)
    mode.
- id: geo-lines-angles
  strand: geo
  engine: shape-board
  order: 3
  concepts: [geo.lines.basic, geo.lines.parallel-perpendicular, geo.angles.basic]
  title_fa: خط، نیم‌خط، پاره‌خط و زاویه
  title_en: Lines, rays, segments and angles
  ages: [8, 12]
  grades: {iran: 3, af: 3, uk: 3}
  notes: 'Draw point, line, ray and segment (Iran G3 «خط، نیم‌خط و پاره‌خط»), parallel and perpendicular lines, and angles as turns: right, acute, obtuse compared with a right-angle corner.'
- id: geo-triangles-quads
  strand: geo
  engine: shape-board
  order: 4
  concepts: [geo.triangles, geo.quadrilaterals.types, geo.quadrilaterals.properties]
  title_fa: مثلث‌ها و چهارضلعی‌ها
  title_en: Triangles and quadrilaterals
  ages: [9, 12]
  grades: {iran: 4, af: 5, uk: 4}
  notes: 'Classify triangles by sides and angles, build the quadrilateral family (inclusive: a square is a rectangle and a rhombus), then diagonals and angles. UK ''trapezium'' = Iran «ذوزنقه»; Afghan «متوازی‌الاضلاع».'
- id: geo-polygons-angles
  strand: geo
  engine: shape-board
  order: 5
  concepts: [geo.polygons, geo.triangles.angle-sum, geo.polygons.angles]
  title_fa: چندضلعی‌ها و مجموع زاویه‌ها
  title_en: Polygons and angle sums
  ages: [10, 12]
  grades: {iran: 5, af: 5, uk: 5}
  notes: Regular vs irregular polygons, triangle angle sum 180°, then split a polygon into triangles for interior sums (Iran G5 chapter «تقارن و چندضلعی‌ها»).
- id: geo-angles-measure
  strand: geo
  engine: measure
  order: 6
  concepts: [geo.angles.measure, geo.angles.facts, geo.angles.bisector]
  title_fa: اندازه‌گیری زاویه با نقاله
  title_en: Measuring angles with a protractor
  ages: [10, 12]
  grades: {iran: 4, af: 5, uk: 5}
  notes: Read and draw angles with the protractor (inner/outer scale), angles on a line, at a point and vertically opposite (Iran «متمم، مکمل»), then bisect by halving the measure (Iran G5, Afghan G6 «نیمساز»).
- id: geo-circle-constructions
  strand: geo
  engine: measure
  order: 7
  concepts: [geo.circle.parts, meas.circle.circumference, geo.construct.triangles, geo.construct.basic]
  title_fa: دایره، عدد پی و رسم‌های هندسی
  title_en: Circles, π and constructions
  ages: [10, 12]
  grades: {iran: 5, af: 4, uk: 6}
  notes: Measure radius and diameter, wrap a tape round circles to find circumference ÷ diameter ≈ π (Iran 3/14), construct triangles from given sides/angles; ruler-and-compass constructions (Afghan G6
    «ترسیمات هندسی») need a compass tool added to the measure engine.
- id: meas-compare-units
  strand: meas
  engine: measure
  order: 1
  concepts: [meas.compare.direct, meas.units.nonstandard]
  title_fa: 'مقایسهٔ اندازه‌ها: بلندتر، سنگین‌تر، پرتر'
  title_en: 'Comparing: longer, heavier, fuller'
  ages: [5, 8]
  grades: {iran: 1, af: 1, uk: 1}
  notes: Compare side by side, on a balance and by pouring; then measure with hand-spans, paper clips and cups (Afghan «واحدهای غیر معیاری», Afghan G1 «خورد، کلان، سبک، سنگین»).
- id: meas-length-mass-capacity
  strand: meas
  engine: measure
  order: 2
  concepts: [meas.length, meas.mass, meas.capacity, meas.estimate, meas.accuracy.precision]
  title_fa: اندازه‌گیری طول، جرم و گنجایش
  title_en: Measuring length, mass and capacity
  ages: [5, 12]
  grades: {iran: 1, af: 2, uk: 1}
  notes: Ruler from the zero mark, scales and a jug; estimate first, then measure to the nearest cm then mm (Iran G2 «اندازه‌گیری دقیق‌تر»). Afghan spells «ملی متر»; UK uses the same metric units.
- id: meas-time-calendar
  strand: meas
  engine: clock-calendar-money
  order: 3
  concepts: [meas.time, meas.time.24h, meas.time.units, meas.time.calendar]
  title_fa: ساعت و تقویم
  title_en: Clocks and calendars
  ages: [5, 12]
  grades: {iran: 1, af: 3, uk: 1}
  notes: 'O''clock and half past (UK Y1), then 5-minute times, 24-hour time (Iran G3 «ساعت در بعدازظهر»), durations and unit conversions. Calendars: Solar Hijri with Iranian month names (فروردین…, first
    six months 31 days) for fa-IR, Solar Hijri with Dari/Pashto names (حمل، ثور…) for fa-AF/ps, Gregorian for en; the week starts on Saturday (fa) vs Monday (en).'
- id: meas-perimeter-area
  strand: meas
  engine: shape-board
  order: 4
  concepts: [meas.perimeter, meas.area.concept, meas.area.rectilinear, meas.area-perimeter.relation]
  title_fa: محیط و مساحت
  title_en: Perimeter and area
  ages: [8, 12]
  grades: {iran: 3, af: 2, uk: 3}
  notes: Walk the boundary for perimeter, cover with unit squares for area, then length × width for rectangles and rectilinear shapes; show that equal areas can have different perimeters. Iran G3 chapter
    «محیط و مساحت».
- id: meas-convert
  strand: meas
  engine: measure
  order: 5
  concepts: [meas.units.convert, meas.area.units, meas.problems]
  title_fa: تبدیل واحدها
  title_en: Converting units
  ages: [9, 12]
  grades: {iran: 3, af: 4, uk: 4}
  notes: Convert km/m/cm/mm, kg/g, l/ml with a ×10/100/1000 conversion strip, area units (cm² ↔ m²), then multi-step measure problems.
- id: meas-area-shapes
  strand: meas
  engine: shape-board
  order: 6
  concepts: [meas.area.triangle-parallelogram, meas.area.rhombus-trapezium, meas.area.circle, meas.area.composite]
  title_fa: مساحت مثلث، متوازی‌الاضلاع، ذوزنقه و دایره
  title_en: Area of triangles, parallelograms, trapezia and circles
  ages: [10, 12]
  grades: {iran: 4, af: 6, uk: 6}
  notes: 'Cut and rearrange on the grid: parallelogram → rectangle, triangle = half a parallelogram, trapezium = two triangles, circle by counting squares then πr², composite shapes. Rhombus/trapezium/circle
    area are Iran G5–6, Afghan G6; not in UK KS2.'
- id: meas-volume
  strand: meas
  engine: shape-board
  order: 7
  concepts: [meas.volume.concept, meas.volume.cuboid, geo.solids.nets]
  title_fa: حجم مکعب مستطیل و گستردهٔ آن
  title_en: Volume of cuboids and nets
  ages: [10, 12]
  grades: {iran: 5, af: 6, uk: 5}
  notes: Count unit cubes layer by layer (base area × height), then nets of cubes and cuboids. Needs the shape-board's isometric layer view.
- id: meas-extra-uk-units
  strand: meas
  engine: measure
  order: 8
  concepts: [meas.temperature, meas.units.imperial]
  title_fa: 'تکمیلی: دماسنج و واحدهای انگلیسی'
  title_en: 'Extra: thermometers and imperial units'
  ages: [7, 11]
  grades: {iran: null, af: null, uk: 2}
  notes: 'Extra studio (both concepts specialist, UK only): read a thermometer scale in °C, then inches, pounds, pints and miles with metric equivalents.'
  extra: true
- id: pos-position-turns
  strand: pos
  engine: shape-board
  order: 1
  concepts: [pos.position.language, pos.turns]
  title_fa: مکان، جهت و چرخش
  title_en: Position, direction and turns
  ages: [5, 8]
  grades: {iran: 1, af: 1, uk: 1}
  notes: Move a character on the grid with above/below/left/right/between, then whole, half, quarter and three-quarter turns, clockwise and anticlockwise. Left/right words must not flip in RTL.
- id: pos-coordinates-translation
  strand: pos
  engine: shape-board
  order: 2
  concepts: [pos.coordinates.first-quadrant, pos.coordinates.shapes, pos.translation]
  title_fa: مختصات و انتقال
  title_en: Coordinates and translation
  ages: [9, 12]
  grades: {iran: 6, af: 9, uk: 4}
  notes: Plot points in the first quadrant (x first), complete shapes from vertices, translate shapes by a given move. UK Y4–5; Iran G6 chapter «تقارن و مختصات».
- id: pos-transformations
  strand: pos
  engine: shape-board
  order: 3
  concepts: [pos.coordinates, pos.reflection, pos.rotation, geo.symmetry.rotational, pos.coordinates.transformations]
  title_fa: بازتاب، دوران و تقارن مرکزی
  title_en: Reflection, rotation and rotational symmetry
  ages: [10, 12]
  grades: {iran: 5, af: 8, uk: 5}
  notes: Extend to four quadrants, reflect in a line, rotate about a point (Iran G6 «دوران»), find rotational/point symmetry, describe all on coordinates. Rotation is not in UK KS2.
- id: ratio-ratio-share
  strand: ratio
  engine: fraction-bars
  order: 1
  concepts: [ratio.ratio, ratio.simplify, ratio.ratio-fraction, ratio.share]
  title_fa: نسبت و تقسیم به نسبت
  title_en: Ratio and sharing in a ratio
  ages: [11, 12]
  grades: {iran: 5, af: 6, uk: 6}
  notes: 'Two-colour bars show a : b, equivalent and simplified ratios, the link to fractions of the whole, then share an amount in a ratio (bar model, UK Y6; Afghan G8).'
- id: ratio-proportion
  strand: ratio
  engine: problem-canvas
  order: 2
  concepts: [ratio.unitary, ratio.rate, ratio.proportion, ratio.proportion.direct, ratio.proportion.inverse, ratio.problems]
  title_fa: تناسب و روش واحد
  title_en: Proportion and the unitary method
  ages: [10, 12]
  grades: {iran: 5, af: 6, uk: 5}
  notes: '''Make a table'' strategy: the Iranian proportion table («جدول تناسب», G5–6), the UK unitary method and recipes, unit rates; inverse proportion (Afghan G6) last.'
- id: ratio-scale-similar
  strand: ratio
  engine: shape-board
  order: 3
  concepts: [ratio.scale-factor, geo.similarity]
  title_fa: بزرگ‌نمایی و شکل‌های متشابه
  title_en: Scale factors and similar shapes
  ages: [11, 12]
  grades: {iran: 9, af: 8, uk: 6}
  notes: Enlarge a grid shape by a scale factor, compare side lengths, decide if two shapes are similar (UK Y6; Iran G9, Afghan G8).
- id: seq-patterns
  strand: seq
  engine: pattern-machine
  order: 1
  concepts: [seq.patterns.shape, seq.patterns.number]
  title_fa: الگوهای تکراری و الگوهای عددی
  title_en: Repeating and number patterns
  ages: [7, 12]
  grades: {iran: 2, af: null, uk: 2}
  notes: Continue and make repeating shape patterns, then growing and number patterns (Iran G2–3 «الگو»).
- id: seq-machines-rules
  strand: seq
  engine: pattern-machine
  order: 2
  concepts: [seq.input-output, seq.term-to-term, seq.arithmetic]
  title_fa: ماشین ورودی ـ خروجی و قاعدهٔ الگو
  title_en: Input–output machines and sequence rules
  ages: [9, 12]
  grades: {iran: 3, af: 11, uk: 6}
  notes: Find the rule of a machine (Iran G3 «ماشین‌های ورودی ـ خروجی»), term-to-term rules, then a position-to-term rule for linear sequences (UK Y6).
- id: alg-expressions-formulae
  strand: alg
  engine: pattern-machine
  order: 1
  concepts: [ops.order-of-operations, alg.notation, alg.formulae, alg.equation.two-unknowns]
  title_fa: ترتیب عمل‌ها، حرف به جای عدد و فرمول
  title_en: Order of operations, letters and formulae
  ages: [11, 12]
  grades: {iran: 7, af: 7, uk: 6}
  notes: Evaluate expressions step by step with brackets and priority (Iran «اولویت عمل‌ها», UK BIDMAS), let a letter stand for the input of a machine, use simple formulae, list pairs that satisfy a + b
    = 10 (UK Y6).
- id: stat-tally-pictogram
  strand: stat
  engine: chart-builder
  order: 1
  concepts: [stat.data-collection, stat.tally-tables, stat.pictogram]
  title_fa: جمع‌آوری داده، چوب‌خط و نمودار تصویری
  title_en: Collecting data, tallies and pictograms
  ages: [7, 12]
  grades: {iran: 2, af: 7, uk: 2}
  notes: Sort and count a class survey (Iran G2 «سرشماری»), record with tally marks (Iran «چوب‌خط»), and build a pictogram where one symbol may stand for 2.
- id: stat-bar-line
  strand: stat
  engine: chart-builder
  order: 2
  concepts: [stat.bar-chart, stat.line-graph, stat.charts.choose-interpret]
  title_fa: نمودار ستونی و خط شکسته
  title_en: Bar charts and line graphs
  ages: [7, 12]
  grades: {iran: 2, af: 8, uk: 2}
  notes: Build and read bar charts, then line graphs over time, then choose the right chart for a question (Iran G2–3 «انتخاب نمودار»).
- id: stat-pie-mean
  strand: stat
  engine: chart-builder
  order: 3
  concepts: [stat.pie-chart, stat.mean, stat.variable-types]
  title_fa: نمودار دایره‌ای و میانگین
  title_en: Pie charts and the mean
  ages: [9, 12]
  grades: {iran: 3, af: 7, uk: 4}
  notes: Read pie charts as fractions of a whole (Iran G3, UK Y6), compute the mean by levelling bars, sort data types (categorical vs numerical).
- id: prob-chance
  strand: prob
  engine: probability-sim
  order: 1
  concepts: [prob.chance-language, prob.basic]
  title_fa: 'احتمال: حتمی، ممکن، غیرممکن'
  title_en: 'Chance: certain, possible, impossible'
  ages: [8, 12]
  grades: {iran: 2, af: 7, uk: 7}
  notes: Spin, toss and roll; place events on a certain–impossible scale, then as a fraction 0–1 for equally likely outcomes (Iran G2 «مفهوم احتمال»). Not in UK KS2, so en is enrichment.
- id: ps-draw-picture
  strand: ps
  engine: problem-canvas
  order: 1
  concepts: [ps.understand-problem, ps.draw-diagram, ops.word-problems.add-sub]
  title_fa: 'حل مسئله: رسم شکل'
  title_en: 'Problem solving: draw a picture'
  ages: [5, 12]
  grades: {iran: 1, af: 5, uk: 1}
  notes: Read the problem, say what is known and asked (Iran's four steps), draw it, then solve one-step add/subtract story problems. Iran puts a «حل مسئله» lesson in every chapter; UK Y1 uses concrete
    and pictorial problems.
- id: ps-symbolic
  strand: ps
  engine: problem-canvas
  order: 2
  concepts: [ps.symbolic, alg.missing-number, ops.word-problems.mul-div]
  title_fa: 'حل مسئله: روش نمادین'
  title_en: 'Problem solving: number sentences'
  ages: [5, 12]
  grades: {iran: 2, af: null, uk: 1}
  notes: Turn a story into a number sentence with a box for the unknown (□ + 4 = 9), solve missing numbers, then multiplication/division and mixed-operation stories.
- id: ps-model-pattern-guess
  strand: ps
  engine: problem-canvas
  order: 3
  concepts: [ps.act-out-model, ps.find-pattern, ps.eliminate, ps.guess-check]
  title_fa: 'حل مسئله: الگوسازی، الگویابی، حذف حالت‌ها و حدس و آزمایش'
  title_en: 'Problem solving: model, pattern, eliminate, guess and check'
  ages: [8, 12]
  grades: {iran: 2, af: null, uk: null}
  notes: 'One mission per Iran G2 strategy: make a model, look for a pattern, cross out impossible cases, guess-check-improve with a table.'
- id: ps-multistep-listing
  strand: ps
  engine: problem-canvas
  order: 4
  concepts: [ps.simpler-problem, ps.sub-problems, ps.systematic-listing, disc.counting.listing, ps.choose-strategy]
  title_fa: 'حل مسئله: زیرمسئله، مسئلهٔ ساده‌تر و فهرست منظم'
  title_en: 'Problem solving: sub-problems, simpler cases and systematic lists'
  ages: [8, 12]
  grades: {iran: 2, af: null, uk: 4}
  notes: Break a multi-step problem into steps, solve a smaller version first, list all possibilities in order, then choose and combine strategies yourself.
deferred:
- concept: frac.complex
  reason: Specialist, Afghan G5 only (کسر مرکب). Needs nested fraction typesetting the engines lack; its maths is fraction division, already covered in frac-mul-div and frac-mixed-mul-div. Revisit as an
    Afghan-only extra mission there.
- concept: ops.calculator
  reason: Specialist; no calculator engine planned for Phase 2 and the academy aims at mental/written methods. Iran mentions it only in passing; it can come back as a calculator check inside estimation
    missions later.
