  grades:
    iran: 11
    af: 10
    uk: 8
  notes: >-
    UK-led (KS3 "compare observed distributions … central tendency … and spread (range, consideration of outliers)").
    Two dot plots (two classes' jump distances): compare with one average and the range, in a sentence; drag one value
    far out and watch mean/median/range react; decide whether a value is a mistake or real. Misconceptions: comparing
    averages only; "more spread is better"; an outlier deleted without a reason; the mean thought robust to outliers.
