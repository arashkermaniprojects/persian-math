  grades:
    iran: 10
    af: 7
    uk: 10
  notes: >-
    A hidden bag is the population: draw random samples of 10 and of 50 and compare the sample proportions with the
    (revealed) population; then choose a method (questionnaire, observation, experiment, records) and spot biased
    sampling (asking only your friends) (Afghan G7 ch.7 «روش‌های جمع‌آوری اطلاعات», «جامعه و نمونه», «نمونهٔ تصادفی»
    p.187; Iran G10 ریاضی ۱ ch.7 «جامعه و نمونه» p.152; UK GCSE S1). Misconceptions: a sample = the population; a
    bigger sample is always unbiased; a convenient sample is random; every sample gives the same answer.
