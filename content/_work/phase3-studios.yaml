    UK KS3 "grouped data … vertical line (or bar) charts for … grouped numerical data"). Equal class widths only (unequal
    widths are GCSE Higher, Phase 4). Misconceptions: overlapping or gapped classes; a boundary value counted twice;
    gaps between histogram bars; polygon points at class ends; relative frequencies not summing to 1.
