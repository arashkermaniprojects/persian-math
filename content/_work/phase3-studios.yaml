  grades:
    iran: 10
    af: 7
    uk: 7
  notes: >-
    Pilot of the chart-builder `summary` module. Line up data cards in order on a dot plot, tap the middle (or the two
    middles) for the median, the tallest stack for the mode, the ends for the range; compare with the levelled mean
    from Phase 2; then choose the best average for shoe sizes, wages with one large value, and favourite colours
    (Afghan G7 ch.7 «مد (Mode)» p.187, G9 ch.8 «میانه، ساحهٔ تحول» p.195; UK KS3 Statistics "measures of central
    tendency (mean, mode, median) and spread (range …)"; Iran G8 ch.8 «میانگین داده‌ها» p.124 and G10 آمار for
    median/mode). Misconceptions: median without ordering; the median of an even count taken as one card; the mode
    given as its frequency; range = the largest value; the mean of categorical data.
- id: stat-compare-outliers
  strand: stat
  engine: chart-builder
  module: summary
  order: 5
  concepts:
  - stat.outliers
  - stat.compare-distributions
  title_fa: دادهٔ پرت و مقایسهٔ دو مجموعه داده
  title_en: Outliers and comparing two data sets
