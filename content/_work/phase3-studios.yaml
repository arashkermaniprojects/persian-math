# ---------------------------------------------------------------- measures (3D)
- id: meas-prisms-volume-surface
  strand: meas
  engine: solid-viewer
  order: 9
  concepts:
  - meas.volume.prisms
  - meas.surface-area.prisms
  - geo.solids.nets
  title_fa: حجم و مساحت منشور و استوانه
  title_en: Volume and surface area of prisms and cylinders
  ages: [12, 14]
  grades:
    iran: 7
    af: 8
    uk: 8
  notes: >-
    Pilot of solid-viewer. Turn a prism, pick its base (the cross-section), stack base layers to see volume = base
    area × height; unfold the prism and the cylinder (a rectangle of width 2πr) to count lateral and total area (Iran
    G7 ch.6 «حجم‌های هندسی» p.70, «محاسبهٔ حجم‌های منشوری» p.73, «مساحت جانبی و کل» p.76, «حجم و سطح» p.79; Afghan G8
    ch.6 «مساحت و حجم منشور، مساحت و حجم استوانه» p.141; UK KS3 "volume of cuboids … and other prisms (including
    cylinders)"). Misconceptions: a rectangular side face taken as the base of a triangular prism; surface area
    from the visible faces only; cylinder lateral area = πr²h; cm² and cm³ mixed; volume as the sum of edges.
- id: meas-pyramid-cone-sphere
  strand: meas
  engine: solid-viewer
  order: 10
  concepts:
  - meas.volume.pyramid-cone
  - meas.surface-area.pyramid-cone
  - meas.volume.sphere
  - meas.volume.composite
  - meas.circle.sector
  title_fa: حجم و مساحت هرم، مخروط و کره
  title_en: Pyramids, cones, spheres and composite solids
  ages: [13, 15]
  grades:
    iran: 9
    af: 8
    uk: 10
  notes: >-
    Pour a pyramid of water into its prism three times (animation) for the ⅓; unroll a cone into a sector (bridge
    concept meas.circle.sector) for πrl; find slant height with Pythagoras; sphere = ⅔ of its cylinder
    (Archimedes); then a tower of a cylinder and a hemisphere (Iran G9 ch.8 «حجم و مساحت کره» p.131, «حجم هرم و
    مخروط» p.135, «سطح و حجم» p.140; Afghan G8 ch.6 «مساحت و حجم هرم» p.145, «مساحت و حجم مخروط، مساحت و حجم کره» p.149;
    UK GCSE G17/KS4). Misconceptions: forgetting the ⅓; slant height used for volume and vertical height for lateral
    area; 4πr² vs 4/3 πr³ swapped; the joining face of a composite solid counted in its surface area.
