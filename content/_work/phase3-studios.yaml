    «شهود فضایی» p.94, G10 هندسه ۱ ch.4 «تفکر تجسمی» p.87; Afghan G8 ch.6 «دریافت قطر مکعب مستطیل و مکعب» p.137;
    UK GCSE G13, G20). Misconceptions: hidden cubes forgotten in a view; left and right side views swapped; the space
    diagonal taken as the face diagonal; adding the three edges.
