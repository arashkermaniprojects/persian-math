    tangent stays perpendicular to the radius (Iran G8 ch.9 «خط و دایره» p.138, «زاویه‌های مرکزی» p.142,
    «زاویه‌های محاطی» p.146; Afghan G9 ch.1 «حالات یک مستقیم با دایره، موقعیت دو دایره» and «زوایای مربوط به دایره»
    p.1, ch.2 «خط مماس به دایره» p.27; UK GCSE G9–G10, Higher). Misconceptions: inscribed = central; a tangent
