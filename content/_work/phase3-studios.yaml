    Run 10, 100, 1000 trials of a drawing pin model (an unequal spinner), a fair and a biased die; watch relative
    frequency settle near the theory line; decide fair or not (Iran G7 ch.9 «احتمال و تجربه» p.121; Afghan G7 ch.8
    «تجربه کردن یک اتفاق» p.211, G8 ch.11 «کثرت نسبی و احتمال» p.243 and «چانس برابر و نابرابر» p.245; UK KS3
    "randomness, fairness, equally and unequally likely outcomes"). Misconceptions: gambler's fallacy ("6 is due");
    10 trials are enough to judge; unequal sectors treated as equally likely; relative frequency must match the
    theory exactly. No gambling contexts.
