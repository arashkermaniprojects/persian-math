    from the mean, average them; two sets with the same range but different spread. Misconception: signed deviations
    averaged (always 0). Featured for fa-AF/ps.
  extra: true
# ---------------------------------------------------------------- probability
- id: prob-experiments
  strand: prob
  engine: probability-sim
