    انتقال» p.107; UK GCSE G24). Iran writes the column vector with brackets as in docs/NOTATION.md (shape-board
    `label-coords` "{x}\n{y}"). Misconceptions: the vector read head → tail; components swapped; equal vectors thought to
    need the same position; the opposite vector drawn in the same direction.
