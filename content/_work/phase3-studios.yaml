  ages: [13, 17]
  grades:
    iran: 10
    af: 11
    uk: 9
  notes: >-
    Plot (hours of practice, score) pairs, describe the relationship, drag a line of best fit through the middle of
    the cloud, predict inside the range and be wary outside it (UK KS3 "describe simple mathematical relationships
    between two variables (bivariate data) … scatter graphs"; Iran G10 آمار ۱ «نمودارهای چندمتغیره» p.110; Afghan
    G11). Uses coord-plane points mode and a draggable line. Misconceptions: correlation means one causes the other;
