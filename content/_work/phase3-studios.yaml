    column and its graph plotted at class ends, reading the median off it (Iran G8 ch.8 «میانگین داده‌ها» p.124;
    Afghan G8 ch.10 «کثرت تجمعی» p.225 and «اوسط دیتای متمادی با استفاده از جدول» p.233, G9 ch.8 «اوسط وزنی»; UK GCSE
    S3/S4). Misconceptions: grouped mean = sum of frequencies ÷ number of classes; class width used for the midpoint;
    the plain mean of two averages; the cumulative curve plotted at midpoints.
