    cyclic quadrilateral's vertices: opposite angles keep summing to 180°; two crossing chords keep AP × PB = CP × PD
    (Afghan G9 ch.2 «دایرهٔ محیطی، دایرهٔ محاطی», «خصوصیات چهار ضلعی مرسوم به دایره», «روابط طولی در دایره», «طاقت یک
    نقطه نظر به یک دایره» p.27; Iran G11 هندسه ۲ ch.1 p.18–24; UK GCSE G10). Misconceptions: opposite angles of a
    cyclic quadrilateral equal; chord lengths added instead of multiplied; the circumcentre always inside the
    triangle; incircle and circumcircle swapped.
