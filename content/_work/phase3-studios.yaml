    uk: 8
  notes: >-
    List the sample space of a spinner and a coin, then two dice as a 6 × 6 grid (`space` tiles); count favourable
    cells; P(not A) = 1 − P(A) (Iran G8 ch.8 «بررسی حالت‌های ممکن» p.132; Afghan G7 ch.8 «تجربهٔ تصادفی», «فضای
    نتیجه یا نمونه» p.211, G8 ch.11 «قواعد احتمال» p.247; Iran G9 ch.1 «مجموعه‌ها و احتمال» p.15; UK KS3 "theoretical
    sample spaces for single and combined events"; "probabilities of all possible outcomes sum to 1"). Misconceptions:
    sums 2–12 equally likely; (H, T) and (T, H) as one outcome; P(not A) = 1 + P(A) or 1/P(A); repeated outcomes in the
    list. Needs a two-device grid view in `space` (small additive change).
- id: prob-venn-events
  strand: prob
  engine: discrete-lab
  order: 4
  concepts:
  - disc.sets.venn
  - prob.events-sets
  - prob.venn
  - prob.addition-rule
  - prob.two-way-tables
  title_fa: نمودار ون، پیشامدها و جدول دوطرفه
  title_en: Venn diagrams, events and two-way tables
  ages: [13, 15]
  grades:
    iran: 9
    af: 9
    uk: 9
  notes: >-
    Sort 30 pupils by "plays football" and "plays chess" into a Venn diagram, flip the same data into a two-way table
    and back; events as sets: A ∪ B, A ∩ B, A′; P(A or B) = P(A) + P(B) − P(A and B), and for mutually exclusive events
    without the overlap (Iran G9 ch.1 «مجموعه‌ها و احتمال» p.15; Afghan G9 ch.9 «اتحاد و تقاطع حوادث اتفاقی», «ست کلی
    و مکمله», «مدل‌سازی با ست‌ها» p.221; UK KS3 "enumerate sets and unions/intersections … tables, grids and Venn
    diagrams"). Misconceptions: n(A ∪ B) = n(A) + n(B) with an overlap; "only A" confused with "A"; P(A or B) added for
    non-exclusive events; the outside region forgotten; table totals not matching.
- id: prob-trees-counting
  strand: prob
  engine: discrete-lab
  module: tree
  order: 5
  concepts:
  - prob.tree-diagram
  - prob.independent
  - disc.counting
  title_fa: نمودار درختی، اصل ضرب و پیشامدهای مستقل
  title_en: Tree diagrams, the product rule and independent events
  ages: [13, 16]
  grades:
    iran: 10
    af: 8
    uk: 10
  notes: >-
    Pilot of the discrete-lab `tree` module. Grow a tree for outfits (3 shirts × 2 trousers) and count leaves → the
    product rule; put probabilities on branches, multiply along a path and add paths; with and without replacement
    (Afghan G8 ch.11 «دیاگرام درختی، قاعدهٔ اول مسیر (حاصل ضرب)» p.251, G9 ch.9 «اصل شمارش» p.221; Iran G10 ریاضی ۱
    ch.6 «شمارش» p.119; UK GCSE P8, N5). Misconceptions: adding along branches; branch probabilities not summing to 1;
    replacement ignored; 3 shirts and 2 trousers make 5 outfits; dependence assumed for coin tosses.
# ---------------------------------------------------------------- sets (discrete)
- id: disc-sets-intro
  strand: disc
  engine: discrete-lab
  order: 1
  concepts:
  - disc.sets
  - disc.sets.subset
  - disc.sets.operations
  - disc.sets.complement
  - disc.sets.finite-infinite
  title_fa: 'مجموعه‌ها: عضو، زیرمجموعه، اجتماع، اشتراک و متمم'
  title_en: 'Sets: elements, subsets, union, intersection and complement'
  ages: [12, 15]
  grades:
    iran: 9
    af: 7
    uk: 8
  notes: >-
    Pilot of discrete-lab (Venn mode). Drag element cards into set ovals and write the set in braces (order and
    repeats don't matter); nest one oval in another for ⊆; shade A ∪ B, A ∩ B, A − B and A′ inside a universal set;
    decide which sets are finite ({x | x is a whole number < 10} vs the even numbers) (Iran G9 ch.1 «معرفی مجموعه» p.2,
    «مجموعه‌های برابر و نمایش مجموعه‌ها» p.6, «اجتماع، اشتراک و تفاضل» p.11, G9 gifted «بی‌شمارش» p.19; Afghan G7 ch.1
    «ست» p.3–26 incl. «ست کلی و مکملهٔ یک ست»; UK KS3 "enumerate sets and unions/intersections", "infinite nature of the
    sets of integers, real and rational numbers"). Afghan word «ست», Iranian «مجموعه». Misconceptions: {1, 2} ≠
    {2, 1}; ∅ = {0}; ∈ vs ⊆; A − B = B − A; the overlap counted twice in A ∪ B.
deferred:
- concept: ops.calculator
  reason: Specialist; as in Phase 2, no calculator engine and the academy teaches mental/written methods. UK KS3
    "use a calculator … and interpret" is the only lower-secondary source; trig uses the Afghan printed table instead.
    Can return as a calculator-check step in estimation missions.
- concept: disc.graph
  reason: Specialist, Iran G7 gifted supplement only (one game page, «کارگاه بازی ـ مثلث همرنگ» p.5); graphs are taught
    properly in Iran G12 ریاضیات گسسته ch.2. Defer to Phase 5 with the discrete-lab graph mode, so Phase 3 does not
    build a mode for one page.
- concept: ps.games
  reason: Specialist, Iran G7 gifted supplement only (four «کارگاه بازی» pages). The games fit as extra missions in their
    topic studios (integer tic-tac-toe in num-integer-operations, «شمارنده و هُپ» in num-prime-factor-roots) once
    those exist; no studio of their own.
