  title_en: Transformations and enlargement
  ages: [12, 15]
  grades:
    iran: 7
    af: 9
    uk: 8
  notes: >-
    Which transformations keep lengths, angles and orientation (translation, reflection, rotation) and which keep only
    angles (enlargement); enlarge from a centre by 2 and by ½ with rays from the centre; find the centre and factor of
    a given enlargement (Iran G7 ch.4 «تبدیلات هندسی (انتقال، تقارن، دوران)» p.48; Afghan G9 ch.3 «تغییر مکان، انتقال،
    انعکاس، دوران» p.55; UK KS3 "properties of … translations, rotations and reflections", "similar shapes by
    enlargement, with and without coordinate grids"; Iran G11 هندسه ۲ for تجانس). Uses `image: { scale }`.
    Misconceptions: reflection keeps orientation; enlargement measured from the shape, not the centre; factor ½ makes
    it bigger; area scales by the same factor as length.
# ---------------------------------------------------------------- trigonometry
- id: trig-ratios
  strand: trig
  engine: shape-board
  module: dynamic
  order: 1
  concepts:
  - trig.right-triangle
  - trig.solve-right-triangle
  title_fa: نسبت‌های مثلثاتی در مثلث قائم‌الزاویه
  title_en: Trigonometric ratios in right triangles
  ages: [13, 16]
  grades:
    iran: 10
    af: 9
    uk: 9
  notes: >-
    Grow a right triangle with a fixed 35° angle: the sides change but opposite/hypotenuse stays the same (Thales
    again), so it gets a name, sin; label opposite/adjacent/hypotenuse for each acute angle; then find sides and
    angles using a printed table of values, as the Afghan book does, instead of a calculator (Afghan G9 ch.4 «قضیهٔ
    تالس در مثلثات», «ساین، کوساین، تانجانت زاویهٔ حاده», «جدول مثلثاتی، حل مثلث‌های قایم‌الزاویه» p.95; UK KS3
    "trigonometric ratios in similar triangles"; Iran G10 ریاضی ۱ ch.2 p.29). Misconceptions: opposite/adjacent
    labelled from the wrong angle; sin x read as sin × x; sin⁻¹ as 1/sin; the ratio thought to depend on the triangle's
    size.
- id: trig-special-angles
  strand: trig
  engine: shape-board
  order: 2
  concepts:
  - trig.special-angles
  - trig.equations
  title_fa: نسبت‌های مثلثاتی زاویه‌های خاص
  title_en: 'Exact values for 30°, 45° and 60°'
  ages: [14, 16]
  grades:
    iran: 10
    af: 9
    uk: 10
  notes: >-
    Halve an equilateral triangle of side 2 and a unit square to get exact sin, cos, tan of 30°, 45°, 60°; link tan
    to the gradient of a line («رابطهٔ میل و تانجانت»); then simple equations such as sin x = ½ and tan x = 1 with
    0° < x < 90° only (Afghan G9 ch.4 «نسبت‌های مثلثاتی زوایای خاص، رابطهٔ میل و تانجانت» and «معادلات مثلثاتی» p.95;
    UK GCSE G21; Iran G10). General solutions need the unit circle (Phase 4); here only acute angles. Misconceptions:
    sin 60° = 2 × sin 30°; sin 30° = 30/90; tan 45° = 45; √3/2 and ½ swapped between sin and cos.
