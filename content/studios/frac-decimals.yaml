id: frac-decimals
engine: number-line
strand: frac
order: 7
concepts: [frac.tenths-hundredths, frac.decimals, frac.decimal.compare]
missions:
  - id: place-tenths
    setup: { min: 0, max: 1, denominator: 10, labels: whole, decimal: true, addPoints: 1 }
    check: { type: point-equals, values: [[7, 10]] }
  - id: read-decimal
    setup: { min: 0, max: 1, denominator: 10, labels: whole, decimal: true, fixedPoints: [[3, 10]] }
    answer: decimal
    check: { type: answer-decimal, value: "0.3" }
  - id: compare
    # Zoomed to 0.40–0.60 in hundredths; 0.5 is marked, the learner places 0.45.
    setup: { min: 0, max: 1, denominator: 100, labels: whole, decimal: true, zoom: { from: [40, 100], to: [60, 100] }, fixedPoints: [[1, 2]], addPoints: 1 }
    check: { type: point-equals, values: [[45, 100]] }
  - id: hundredths-zoom
    setup: { min: 0, max: 2, denominator: 100, labels: whole, decimal: true, zoom: { from: [12, 10], to: [13, 10] }, addPoints: 1 }
    check: { type: point-equals, values: [[125, 100]] }
