id: meas-perimeter-area
engine: shape-board
strand: meas
order: 4
concepts: [meas.perimeter, meas.area.concept, meas.area.rectilinear, meas.area-perimeter.relation]
# Iran G3 ch. 5 «محیط و مساحت» (p.85 محیط, p.88 اندازهٔ سطح, p.91 واحد سطح, p.93 length × width and L-shapes cut
# into rectangles); Afghan G4 lessons 23–31 (perimeter of triangle/rectangle/square, then the unit of area).
# One L-shape is used twice: covered with unit squares (area 12), then walked round (perimeter 16).
missions:
  # Area = how many unit squares cover the shape. Squares outside the L are caught; the live count helps.
  - id: cover-shape
    setup:
      x: [0, 6]
      y: [0, 6]
      grid: lines
      mode: cells
      instruction: cells
      show: [area]
      shapes:
        - { pts: [[1, 1], [5, 1], [5, 3], [3, 3], [3, 5], [1, 5]], tone: 2, select: false }
    check: { type: shape-board, within: 0, cells: 12 }
  # Perimeter = the length of the way round. Traps: 12 (gave the area), 11 (counted the squares along the edge,
  # so each corner square was counted once instead of twice).
  - id: walk-around
    setup:
      x: [0, 6]
      y: [0, 6]
      grid: lines
      mode: view
      shapes:
        - { pts: [[1, 1], [5, 1], [5, 3], [3, 3], [3, 5], [1, 5]], tone: 2 }
    answer: integer
    check: { type: answer-integer, value: 16, traps: [{ value: 12, code: area }, { value: 11, code: edge-squares }] }
  # No grid: the side lengths are given, so counting is not possible and length × width is needed.
  # Traps: 20 (perimeter), 10 (added the two sides).
  - id: rectangle-area
    setup:
      x: [0, 7]
      y: [0, 5]
      grid: none
      mode: view
      show: [lengths]
      shapes:
        - { pts: [[0.5, 0.5], [6.5, 0.5], [6.5, 4.5], [0.5, 4.5]], tone: 1 }
    answer: integer
    check: { type: answer-integer, value: 24, traps: [{ value: 20, code: perimeter }, { value: 10, code: added }] }
  # A rectilinear shape split into two rectangles: 6 × 2 + 3 × 3 = 21. Traps: 30 (the whole 6 × 5 box),
  # 27 (6 × 2 + 3 × 5: the corner counted twice), 22 (the perimeter).
  - id: l-shape-area
    setup:
      x: [0, 7]
      y: [0, 6]
      grid: none
      mode: view
      show: [lengths]
      shapes:
        - { pts: [[0.5, 0.5], [6.5, 0.5], [6.5, 2.5], [3.5, 2.5], [3.5, 5.5], [0.5, 5.5]], tone: 0 }
    answer: integer
    check: { type: answer-integer, value: 21, traps: [{ value: 30, code: whole-box }, { value: 27, code: overlap }, { value: 22, code: perimeter }] }
  # Same area, different perimeter: Sara's 4 × 3 rug has area 12 and perimeter 14. Draw any shape on the grid
  # lines with area 12 and perimeter 16 (6 × 2, or an L). Drawing 4 × 3 again gives perimeter-too-small.
  - id: same-area
    setup:
      x: [0, 7]
      y: [0, 5]
      grid: lines
      mode: polygon
      instruction: draw
      show: [area, perimeter, lengths]
    check: { type: shape-board, shape: rectilinear, area: 12, perimeter: 16 }
