id: pos-position-turns
engine: shape-board
strand: pos
order: 1
concepts: [pos.position.language, pos.turns]
# Grade 1–2: position words (left/right, above/below, between) and whole/half/quarter/three-quarter turns,
# clockwise and anticlockwise. Picture-first: each mission has an icon hint. The board is LTR in every locale, so
# "left" is always the learner's left hand side of the screen (Iran G1 counts «سمت چپ / سمت راست» with the hands).
missions:
  # Three shapes in a row. Tap the one to the LEFT of the circle. In RTL pages children often read from the right,
  # so the shape on the right is the classic slip.
  - id: left-of
    setup:
      x: [0, 9]
      y: [0, 3]
      grid: none
      mode: select
      instruction: tap
      shapes:
        - { pts: [[0.5, 0.6], [2.5, 0.6], [1.5, 2.4]], tone: 0, name: triangle }
        - { circle: [4.5, 1.5, 1], tone: 2, name: circle }
        - { pts: [[6.5, 0.5], [8.5, 0.5], [8.5, 2.5], [6.5, 2.5]], tone: 1, name: square }
    check:
      type: shape-board
      selected: [0]
      traps: [{ select: 2, code: right-side }, { select: 1, code: itself }]
  # Above, below, between: slide the red square into the gap between the green square (above) and the blue square (below).
  - id: between
    setup:
      x: [0, 5]
      y: [0, 5]
      grid: lines
      mode: move
      instruction: move
      shapes:
        - { pts: [[3, 3], [4, 3], [4, 4], [3, 4]], tone: 1, name: green }
        - { pts: [[3, 1], [4, 1], [4, 2], [3, 2]], tone: 2, name: blue }
        - { pts: [[0, 0], [1, 0], [1, 1], [0, 1]], tone: 3, name: red, move: true }
    check:
      type: shape-board
      piece: { at: [3, 2] }
  # The arrow points at the tree (up). A quarter turn clockwise points it at the house (right).
  # Turning anticlockwise points at the box (wrong-way); three quarter turns anticlockwise also reach the house (long-way).
  - id: quarter-turn
    setup: &turns
      x: [0, 6]
      y: [0, 6]
      grid: none
      mode: move
      instruction: compass
      shapes:
        - { pts: [[2.4, 5], [3.6, 5], [3, 5.9]], tone: 1, name: tree }
        - { pts: [[4.9, 2.4], [5.9, 2.4], [5.9, 3.2], [5.4, 3.8], [4.9, 3.2]], tone: 3, name: house }
        - { circle: [3, 0.6, 0.45], tone: 2, name: ball }
        - { pts: [[0.1, 2.5], [1.1, 2.5], [1.1, 3.5], [0.1, 3.5]], tone: 5, name: box }
        - { pts: [[2.75, 1.7], [3.25, 1.7], [3.25, 3.4], [3.65, 3.4], [3, 4.3], [2.35, 3.4], [2.75, 3.4]], tone: 0, name: arrow, move: true, turn: true, pivot: [3, 3] }
    check:
      type: shape-board
      piece: { turn: -90 }
  # A half turn clockwise: from the tree to the ball. Two quarter turns anticlockwise end in the same place (long-way).
  - id: half-turn
    setup: *turns
    check:
      type: shape-board
      piece: { turn: -180 }
  # Three quarter turns anticlockwise: tree → box → ball → house. One quarter turn clockwise lands there too (long-way).
  - id: three-quarter-turn
    setup: *turns
    check:
      type: shape-board
      piece: { turn: 270 }
