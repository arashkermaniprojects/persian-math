id: stat-pie-mean
engine: chart-builder
strand: stat
order: 3
concepts: [stat.pie-chart, stat.mean, stat.variable-types]
# Iran G3 «نمودار دایره‌ای» (G03_riazi_sevom.pdf p.124: colour a circle of 12 equal parts for the hours from 6 am
# to 6 pm) and G5 «میانگین» (G05_riazi_panjom.pdf p.193: make two stacks of rings equal; the mean of six
# glasses of apple juice); Afghan G7 «اوسط», G8 «اوسط دیتای غیر متمادی»; UK Y6 pie charts and the mean, Y5–6 kinds
# of data. Pie charts start at 12 o'clock and go clockwise; bars run left → right (docs/NOTATION.md "Charts").
missions:
  # Paint a pie of 12 equal sectors, one per hour from 6 am to 6 pm (Iran G3 p.124): eating and rest 2,
  # travel 2, school 5, homework 3.
  - id: paint-day
    setup:
      instruction: paint
      categories:
        - { key: rest, color: green }
        - { key: travel, color: red }
        - { key: school, color: blue }
        - { key: homework, color: yellow }
      values: [2, 2, 5, 3]
      table: { head: activity, tally: hide, count: show }
      chart: pie
      sectors: 12
      edit: true
    check: { type: chart, values: [2, 2, 5, 3] }
  # Read a pie as fractions of the whole: 40 pupils, half walk, a quarter come by bus, an eighth by car and an
  # eighth by bike. A quarter of 40 = 10. Traps: the denominator (4), a quarter as 25, the half (20).
  - id: read-pie
    setup:
      instruction: read
      categories:
        - { key: walk, color: green }
        - { key: bus, color: blue }
        - { key: car, color: orange }
        - { key: bike, color: purple }
      values: [20, 10, 5, 5]
      chart: pie
    answer: integer
    check:
      type: answer-integer
      value: 10
      traps:
        - { value: 4, code: denominator }
        - { value: 25, code: percent }
        - { value: 20, code: half }
  # The mean as levelling (Iran G5 p.193): four piles of walnuts, 3, 7, 4 and 6. Lowering a bar puts walnuts in
  # the hand; raising one gives them back. All level with none left in the hand = the mean, 5.
  - id: level-mean
    setup:
      instruction: level
      categories:
        - { key: ali, color: brown }
        - { key: sara, color: brown }
        - { key: maryam, color: brown }
        - { key: reza, color: brown }
      values: [3, 7, 4, 6]
      start: [3, 7, 4, 6]
      table: { head: child, tally: hide, count: show }
      chart: bar
      edit: true
      level: true
      max: 8
      step: 1
      axes: [~, walnuts]
    check: { type: chart, level: true }
  # The mean of six glasses of apple juice (Iran G5 p.193): 60 + 80 + 75 + 55 + 65 + 85 = 420, 420 ÷ 6 = 70.
  # Traps: the total, the largest value, the range, the number of glasses.
  - id: mean-of-data
    setup:
      instruction: read
      categories:
        - { key: g1, color: green }
        - { key: g2, color: green }
        - { key: g3, color: green }
        - { key: g4, color: green }
        - { key: g5, color: green }
        - { key: g6, color: green }
      values: [60, 80, 75, 55, 65, 85]
      table: { head: glass, tally: hide, count: show, total: true }
      chart: bar
      max: 100
      step: 10
      axes: [~, ml]
    answer: integer
    check:
      type: answer-integer
      value: 70
      traps:
        - { value: 420, code: total-only }
        - { value: 85, code: largest }
        - { value: 30, code: range }
        - { value: 6, code: count }
  # Kinds of data: which survey question has answers that are numbers (numerical data)? The others give
  # words (categorical data).
  - id: data-types
    setup:
      instruction: pick
      categories:
        - { key: colour, icon: flower, color: pink }
        - { key: height, icon: tree, color: green }
        - { key: transport, icon: house, color: blue }
        - { key: fruit, icon: apple, color: red }
      table: { head: question, tally: hide }
      pick: true
    check:
      type: chart
      pick: height
      traps:
        - { pick: colour, code: words }
        - { pick: transport, code: words }
        - { pick: fruit, code: words }
