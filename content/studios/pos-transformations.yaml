id: pos-transformations
engine: shape-board
strand: pos
order: 3
concepts: [pos.coordinates, pos.reflection, pos.rotation, geo.symmetry.rotational, pos.coordinates.transformations]
# Four quadrants, reflection in an axis, rotation about a point, and point (rotational) symmetry, each described with
# coordinates (Iran G5 «تقارن مرکزی», G6 «دوران» and «تقارن و مختصات», G7 four quadrants; UK Y6 four quadrants and
# reflection; rotation is not in UK KS2, so it is enrichment in en). Coordinates use {{vec:x,y}} and label-coords.
missions:
  # Plot a point in the second quadrant. Dropping the minus sign is the classic slip (sign); swapping x and y is automatic.
  - id: four-quadrants
    setup:
      x: [-4, 4]
      y: [-4, 4]
      grid: lines
      axes: true
      mode: points
      labels: true
      instruction: points
    check:
      type: shape-board
      points: [[-3, 2]]
      traps: [{ point: [3, 2], code: sign }, { point: [3, -2], code: sign }, { point: [-3, -2], code: sign-y }]
  # Reflect the triangle in the y-axis (dashed). A copy slid across instead of flipped is caught (slid, automatic).
  - id: reflect-y-axis
    setup:
      x: [-4, 4]
      y: [-4, 4]
      grid: lines
      axes: true
      mode: polygon
      instruction: mirror
      mirror: [[0, -4], [0, 4]]
      show: [coords]
      shapes:
        - { pts: [[1, 1], [4, 1], [1, 3]], labels: true, tone: 0 }
    check:
      type: shape-board
      image: { reflect: [[0, -4], [0, 4]] }
  # Rotate the triangle 90° clockwise about the origin: (x, y) → (y, −x). Turning anticlockwise is caught (wrong-way).
  - id: rotate-quarter
    setup:
      x: [-4, 4]
      y: [-4, 4]
      grid: lines
      axes: true
      mode: polygon
      instruction: draw
      show: [coords]
      shapes:
        - { pts: [[1, 1], [3, 1], [1, 4]], labels: true, tone: 2 }
    check:
      type: shape-board
      image: { rotate: { about: [0, 0], angle: -90 } }
  # Which shapes have a centre of symmetry (look the same after a half turn)? Parallelogram, Z shape, rectangle.
  # The equilateral triangle fits itself after a third of a turn but not a half turn; the kite and the isosceles
  # trapezium have only a line of symmetry.
  - id: centre-of-symmetry
    setup:
      x: [0, 10]
      y: [0, 7]
      grid: none
      mode: select
      instruction: tap
      shapes:
        - { pts: [[0.5, 4.5], [2.5, 4.5], [3.3, 6.3], [1.3, 6.3]], tone: 0, name: parallelogram }
        - { pts: [[4.2, 4.5], [6.2, 4.5], [5.2, 6.23]], tone: 1, name: triangle }
        - { pts: [[7, 6.2], [8.6, 6.2], [8.6, 5.4], [9.4, 5.4], [9.4, 4.6], [7.8, 4.6], [7.8, 5.4], [7, 5.4]], tone: 2, name: zed }
        - { pts: [[1.5, 0.3], [2.5, 2.3], [1.5, 3], [0.5, 2.3]], tone: 3, name: kite }
        - { pts: [[4, 0.8], [6.6, 0.8], [6.6, 2.6], [4, 2.6]], tone: 4, name: rectangle }
        - { pts: [[7.3, 0.8], [9.7, 0.8], [9, 2.6], [8, 2.6]], tone: 5, name: trapezium }
    check:
      type: shape-board
      selected: [0, 2, 4]
      traps: [{ select: 1, code: third-turn }, { select: 3, code: line-only }, { select: 5, code: line-only }]
  # Complete the figure so the red dot O is its centre of symmetry: draw the half-turn image of the path.
  # Mirroring it in a line instead gives not-image.
  - id: complete-half-turn
    setup:
      x: [0, 8]
      y: [0, 8]
      grid: lines
      mode: path
      corners: 4
      instruction: draw
      shapes:
        - { pts: [[4, 4], [4, 6], [6, 6], [7, 5]], open: true, tone: 0 }
        - { circle: [4, 4, 0.18], tone: 3, name: centre }
    check:
      type: shape-board
      image: { rotate: { about: [4, 4], angle: 180 } }
