id: num-divisibility-powers
engine: pattern-machine
strand: num
order: 10
concepts: [num.divisibility, num.hcf-lcm, num.squares-cubes, num.powers]
# Iran G6 «بخش‌پذیری» (G06_riazi_sheshom.pdf p.19 [۱۱]: boxes of sweets shared between 2 and 5, then the rules
# for 2, 5, 3 and 9), G7 «بزرگ‌ترین شمارندهٔ مشترک» / «کوچک‌ترین مضرب مشترک» (G07 p.72 [۶۲], p.75 [۶۵]) and
# «تعریف توان» (G07 p.94 [۸۴]: folding paper, ۲×۲×۲ = ۲³); Afghan G5 ch. 4 «قابلیت تقسیم» and «بزرگترین قاسم
# مشترک و کوچکترین مضرب مشترک», G6–7 «طاقت و توان‌نما»; UK Y5–6 multiples, factors, square and cube numbers.
# The hundred square has two colours: a number shaded in both shows half and half with a thick edge.
missions:
  # Multiples of 2 in red, multiples of 5 in blue: the numbers in both colours end in 0 (multiples of 10).
  # Tapping 2 and 4, then «keep jumping», shades every second number.
  - id: two-five-ten
    setup:
      mode: hundred
      layers: 2
      instruction: shade
    check:
      type: pattern
      layers: [{ multiples: 2 }, { multiples: 5 }]
  # Multiples of 3 in red, multiples of 9 in blue: every blue number is also red, and its digits add up to 9
  # (or 18 for 99), which is the digit-sum rule.
  - id: three-and-nine
    setup:
      mode: hundred
      layers: 2
      instruction: shade
    check:
      type: pattern
      layers: [{ multiples: 3 }, { multiples: 9 }]
  # Lowest common multiple: watering every 4 days and every 6 days, together again after 12. The square
  # (1–60) is a tool; the typed answer is checked. 24 = 4 × 6 is the classic slip.
  - id: lcm-together
    setup:
      mode: hundred
      from: 1
      to: 60
      layers: 2
      instruction: shade
    answer: integer
    check:
      type: answer-integer
      value: 12
      traps:
        - { value: 24, code: product }
        - { value: 36, code: not-smallest }
        - { value: 48, code: not-smallest }
        - { value: 2, code: common-factor }
        - { value: 10, code: added }
  # Highest common factor: shade the factors of 18 and of 24 (1–24 in rows of 6). The numbers in both colours
  # are the common factors 1, 2, 3, 6; the largest is 6.
  - id: hcf-share
    setup:
      mode: hundred
      from: 1
      to: 24
      cols: 6
      layers: 2
      instruction: shade
    check:
      type: pattern
      layers: [{ factors: 18 }, { factors: 24 }]
  # Square numbers as growing squares: 1, 4, 9, 16, … Figure 5 = 25 and figure 10 = 100. Traps: 2 × n,
  # doubling figure 5, and adding the same jump every time.
  - id: square-numbers
    setup:
      mode: grow
      figure: squares
      rows: [1, 1]
      cols: [1, 1]
      show: 4
      ask: [5, 10]
      instruction: count
    check:
      type: pattern
      answers: true
      traps:
        - { key: t5, value: 10, code: doubled-n }
        - { key: t10, value: 20, code: doubled-n }
        - { key: t10, value: 50, code: doubled-figure }
        - { key: t5, value: 23, code: same-jump }
  # Cube numbers through an n → n³ machine: 3³ = 27, 4³ = 64, 10³ = 1000. Traps: n × 3 and n².
  - id: cube-machine
    setup:
      mode: machine
      rule: "n^3"
      rows: [{ ex: 1 }, { ex: 2 }, 3, 4, 10]
      instruction: machine
    check:
      type: pattern
      answers: true
      traps:
        - { key: r3, value: 9, code: squared }
        - { key: r4, value: 12, code: times-three }
        - { key: r5, value: 30, code: times-three }
        - { key: r4, value: 16, code: squared }
        - { key: r5, value: 100, code: squared }
