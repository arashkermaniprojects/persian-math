id: geo-polygons-angles
engine: shape-board
strand: geo
order: 5
concepts: [geo.polygons, geo.triangles.angle-sum, geo.polygons.angles]
# Iran G5 «چندضلعی‌ها و مجموع زاویه‌های آنها» (p.113 tearing off a triangle's corners, p.119 a quadrilateral cut by a
# diagonal into two triangles); Afghan G5 «مضلع» and «مجموع زاویه‌های مثلث»; UK Y5–Y6 regular polygons and angle sums.
missions:
  # Sort: tap the regular polygons. A rhombus (equal sides only) and a rectangle (equal angles only) are the traps.
  - id: find-regular
    setup:
      x: [0, 9]
      y: [0, 6]
      grid: none
      mode: select
      instruction: tap
      shapes:
        - { pts: [[0.5, 0.5], [2.5, 0.5], [2.5, 2.5], [0.5, 2.5]], tone: 0, name: shape-a }
        - { pts: [[3.5, 0.6], [6.5, 0.6], [6.5, 2.2], [3.5, 2.2]], tone: 1, name: shape-b }
        - { pts: [[8, 0.2], [8.8, 1.5], [8, 2.8], [7.2, 1.5]], tone: 2, name: shape-c }
        - { pts: [[2.8, 4.4], [2.2, 5.4392], [1, 5.4392], [0.4, 4.4], [1, 3.3608], [2.2, 3.3608]], tone: 3, name: shape-d }
        - { pts: [[3.6, 3.4], [5.6, 3.4], [4.6, 5.1321]], tone: 4, name: shape-e }
        - { pts: [[6.5, 3.3], [8.5, 3.3], [8.8, 4.6], [7.6, 5.6], [6.3, 4.8]], tone: 5, name: shape-f }
    check:
      type: shape-board
      selected: [0, 3, 4]
      traps: [{ select: 1, code: angles-only }, { select: 2, code: sides-only }]
  # Draw any triangles; the board shows their angles. Their sum is always 180 (Iran G5 p.113).
  - id: triangle-sum
    setup:
      x: [0, 6]
      y: [0, 5]
      mode: polygon
      instruction: draw
      show: [angles]
    answer: integer
    check:
      type: answer-integer
      value: 180
      traps: [{ value: 360, code: full-turn }, { value: 90, code: one-right }]
  # Missing angles: a right angle and two equal legs, so the other two angles are (180 − 90) ÷ 2 = 45 each.
  - id: missing-angle
    setup:
      y: [0, 5]
      mode: view
      shapes:
        - { pts: [[1, 0.5], [5, 0.5], [1, 4.5]], tone: 2, labels: true }
      show: [right, lengths]
    answer: integer
    check:
      type: answer-integer
      value: 45
      traps: [{ value: 90, code: not-halved }, { value: 60, code: thirds }]
  # Pentagon: split it from one corner into 3 triangles, 3 × 180 = 540. Splitting from a middle point gives 5 × 180 = 900.
  - id: pentagon-sum
    setup:
      mode: segment
      max: 4
      instruction: line
      shapes:
        - { pts: [[1, 1], [5, 1], [6, 4], [3, 6], [0, 4]], tone: 1, labels: true }
    answer: integer
    check:
      type: answer-integer
      value: 540
      traps: [{ value: 900, code: centre-split }, { value: 360, code: like-quad }, { value: 720, code: four-triangles }]
  # Regular hexagon: 4 triangles from one corner, 720; six equal angles, so each is 720 ÷ 6 = 120.
  # Its corners are off the grid, so it is a picture only (the pentagon mission practises the cutting).
  - id: hexagon-angle
    setup:
      grid: none
      mode: view
      shapes:
        - { pts: [[5.5, 3], [4.25, 5.1651], [1.75, 5.1651], [0.5, 3], [1.75, 0.8349], [4.25, 0.8349]], tone: 4, labels: true }
    answer: integer
    check:
      type: answer-integer
      value: 120
      traps: [{ value: 720, code: gave-total }, { value: 60, code: centre-angle }, { value: 180, code: straight }]
